# Render Blueprint — API only. The market-data service has its own repo/blueprint.
services:
  - type: web
    name: shaggy-dogg-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: ORIGIN
        value: https://dex.lumsian.com
      - key: PAYMASTER_ADDRESS
        value: 0x221A9765844511Ef01E383273b396c45372E462a
      - key: PAYMASTER_ELIGIBILITY_MODE
        value: open_portfolio
      - key: PAYMASTER_ALLOWED_WALLETS
        value: 0x9dC0a2E92cC1f08050D2c5F560A45229CcF47C98
      - key: PAYMASTER_SIGNER_PRIVATE_KEY
        sync: false
      - key: PAYMASTER_BUNDLER_URL
        sync: false
      # Set after the market-data service is live, e.g. https://shaggy-dogg-market-data.onrender.com
      - key: MARKET_DATA_URL
        sync: false
      # Empty = wallet admin sign-in disabled on the public API.
      - key: ADMIN_WALLETS
        value: ""
      # Launch records in Supabase, so they survive restarts of this free instance. Set both in the
      # dashboard; with neither, the API falls back to a local SQLite file that each restart erases.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
