# GitHub Actions CI/CD Pipeline for Shaggy Dogg DEX
# Runs tests, type checking, linting, and generates coverage reports

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, fix/*, feat/*]
  pull_request:
    branches: [main, develop]

# Cancel previous runs if new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # TYPE CHECKING
  # ════════════════════════════════════════════════════════════════════════════
  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run type-check

  # ════════════════════════════════════════════════════════════════════════════
  # LINTING
  # ════════════════════════════════════════════════════════════════════════════
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ════════════════════════════════════════════════════════════════════════════
  # TESTING
  # ════════════════════════════════════════════════════════════════════════════
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Artifact tests read contracts/out/*.json, which is build output and not committed.
      - name: Compile contracts for artifact tests
        run: node scripts/compile-contracts.mjs

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ════════════════════════════════════════════════════════════════════════════
  # BUILD
  # ════════════════════════════════════════════════════════════════════════════
  contracts:
    name: Contract verification and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Contracts import OpenZeppelin from node_modules (contracts/foundry.toml remappings).
      - name: Install dependencies
        run: npm ci

      - name: Verify canonical Solidity sources
        run: node scripts/verify-contract-sources.mjs

      - name: Compile and test Solidity contracts
        run: forge test --root contracts -vvv

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [type-check, lint, test, contracts]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7

      - name: Check build size
        run: |
          echo "Build size:"
          du -sh dist/
          echo "Detailed breakdown:"
          du -h dist/* | sort -h

  # ════════════════════════════════════════════════════════════════════════════
  # SECURITY AUDIT
  # ════════════════════════════════════════════════════════════════════════════
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run dependency check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'shaggy-dogg-dex'
          path: '.'
          format: 'HTML'
        continue-on-error: true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: reports/
          retention-days: 7
        if: always()

  # Production is deployed with the Vercel CLI (npx vercel deploy --prod), not from CI.

  # ════════════════════════════════════════════════════════════════════════════
  # NOTIFICATION (Optional)
  # ════════════════════════════════════════════════════════════════════════════
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [type-check, lint, test, build]
    if: always()

    steps:
      - name: Notify on success
        if: ${{ success() }}
        run: |
          echo "✅ All checks passed! Build is ready for deployment."

      - name: Notify on failure
        if: ${{ failure() }}
        run: |
          echo "❌ Pipeline failed. Please check the logs."

      # Optional: Send Slack notification
      # - name: Slack Notification
      #   uses: 8398a7/action-slack@v3
      #   with:
      #     status: ${{ job.status }}
      #     text: 'CI/CD Pipeline: ${{ job.status }}'
      #     webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      #   if: always()
