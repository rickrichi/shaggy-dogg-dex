# Free Supabase projects pause after a week without activity. Reading the launch stats queries the
# launches table through the API, which keeps the project active (and wakes the free API instance).
name: Keep launch store active

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Read launch stats
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the API
        # The free instance can take about a minute to wake, so retry before failing.
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 20 --retry-all-errors \
            https://api.lumsian.com/api/launches/stats
