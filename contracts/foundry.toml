[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "../src/config/dex/artifacts.json" }]
# OpenZeppelin Contracts comes from the root npm install (exact version in package.json).
remappings = ["@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"]
allow_paths = ["../node_modules/@openzeppelin/contracts"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[profile.amm_fork]
[profile.amm_fork.fuzz]
runs = 256

[profile.amm_fork.invariant]
runs = 128
depth = 64
