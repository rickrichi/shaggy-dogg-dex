<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (matching Shaggy Mutt brand colors) -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="35%" stop-color="#7c3aed" />
      <stop offset="70%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Metallic Text Fill Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#f5d0fe" />
    </linearGradient>

    <!-- Subtle Shine Overlay -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1035" flood-opacity="0.6" />
    </feDropShadow>

    <filter id="accent-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#fbbf24" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#brand-grad)" />

  <!-- Diagonal Glass Sheen -->
  <path d="M 0,128 C 0,57.3 57.3,0 128,0 L 384,0 C 454.7,0 512,57.3 512,128 L 512,210 L 0,460 Z" fill="url(#sheen)" />

  <!-- Inner Border Ring -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="6" />

  <!-- Centered Bold "SD" Monogram -->
  <g filter="url(#drop-shadow)">
    <text 
      x="256" 
      y="346" 
      text-anchor="middle" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-weight="900" 
      font-size="260" 
      letter-spacing="-8" 
      fill="url(#text-grad)">SD</text>
  </g>

  <!-- Gold Sparkle / Accent Pip -->
  <circle cx="396" cy="142" r="18" fill="#fbbf24" filter="url(#accent-glow)" />
</svg>
