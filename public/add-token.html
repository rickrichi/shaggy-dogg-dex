<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Import SD Token into MetaMask</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #f5f3ff 0%, #fdf2f8 50%, #eff6ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      color: #1e293b;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 1.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      max-width: 520px;
      width: 90%;
      text-align: center;
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.75rem;
      margin: 0 0 0.5rem;
      background: linear-gradient(to right, #9333ea, #db2777);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .token-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 0.75rem;
      padding: 1rem;
      text-align: left;
      font-family: monospace;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      word-break: break-all;
    }
    .token-box div {
      margin-bottom: 0.35rem;
    }
    .btn {
      background: linear-gradient(to right, #9333ea, #db2777);
      color: white;
      border: none;
      padding: 0.85rem 1.75rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      width: 100%;
      margin-bottom: 0.75rem;
    }
    .btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
    .status {
      margin-top: 1rem;
      font-weight: 500;
      font-size: 0.95rem;
    }
    .status.success { color: #16a34a; }
    .status.error { color: #dc2626; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🐕</div>
    <h1>Import Shaggy Dogg (SD)</h1>
    <p>Click the button below to automatically register the SD token in your MetaMask wallet.</p>

    <div class="token-box">
      <div><strong>Network:</strong> Base Sepolia (84532)</div>
      <div><strong>Token Name:</strong> Shaggy Dogg</div>
      <div><strong>Symbol:</strong> SD</div>
      <div><strong>Decimals:</strong> 18</div>
      <div><strong>Contract:</strong> 0x051c758521971f5c5a84edaf18eea12854375469</div>
    </div>

    <button id="addBtn" class="btn" onclick="addSdToken()">🦊 Add SD to MetaMask</button>
    <button id="switchBtn" class="btn" style="background: #3b82f6; display: none;" onclick="switchToBaseSepolia()">Switch Network to Base Sepolia</button>

    <div id="status" class="status"></div>
  </div>

  <script>
    const SD_ADDRESS = "0x051c758521971f5c5a84edaf18eea12854375469";
    const BASE_SEPOLIA_CHAIN_ID = "0x14a34"; // 84532 in hex

    async function switchToBaseSepolia() {
      if (!window.ethereum) {
        setStatus("MetaMask not found. Please install or open MetaMask extension.", "error");
        return;
      }
      try {
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: BASE_SEPOLIA_CHAIN_ID }],
        });
        document.getElementById("switchBtn").style.display = "none";
        setStatus("Switched to Base Sepolia! Now click 'Add SD to MetaMask'.", "success");
      } catch (switchError) {
        if (switchError.code === 4902) {
          try {
            await window.ethereum.request({
              method: "wallet_addEthereumChain",
              params: [
                {
                  chainId: BASE_SEPOLIA_CHAIN_ID,
                  chainName: "Base Sepolia Testnet",
                  nativeCurrency: { name: "ETH", symbol: "ETH", decimals: 18 },
                  rpcUrls: ["https://sepolia.base.org"],
                  blockExplorerUrls: ["https://sepolia.basescan.org"],
                },
              ],
            });
            document.getElementById("switchBtn").style.display = "none";
            setStatus("Base Sepolia network added! Now click 'Add SD to MetaMask'.", "success");
          } catch (addError) {
            setStatus("Failed to add Base Sepolia: " + addError.message, "error");
          }
        } else {
          setStatus("Failed to switch network: " + switchError.message, "error");
        }
      }
    }

    async function addSdToken() {
      const statusEl = document.getElementById("status");
      if (!window.ethereum) {
        setStatus("MetaMask extension not found in your browser.", "error");
        return;
      }

      try {
        const chainId = await window.ethereum.request({ method: "eth_chainId" });
        if (chainId !== BASE_SEPOLIA_CHAIN_ID) {
          document.getElementById("switchBtn").style.display = "block";
          setStatus("Your wallet is currently on a different network. Please switch to Base Sepolia first.", "error");
          return;
        }

        const wasAdded = await window.ethereum.request({
          method: "wallet_watchAsset",
          params: {
            type: "ERC20",
            options: {
              address: SD_ADDRESS,
              symbol: "SD",
              decimals: 18,
              image: "https://raw.githubusercontent.com/feathericons/feather/master/icons/award.svg",
            },
          },
        });

        if (wasAdded) {
          setStatus("🎉 SD Token successfully imported into MetaMask! You can now see your 1,000,000 SD balance.", "success");
        } else {
          setStatus("Import cancelled by user.", "error");
        }
      } catch (error) {
        setStatus("Error: " + error.message, "error");
      }
    }

    function setStatus(msg, type) {
      const el = document.getElementById("status");
      el.textContent = msg;
      el.className = "status " + type;
    }
  </script>
</body>
</html>
